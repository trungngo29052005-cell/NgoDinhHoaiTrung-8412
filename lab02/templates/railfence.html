<!DOCTYPE html>
<html lang="en">

<head>

    <title>Rail Fence Cipher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>

</head>

<body>

<div class="container">

    <table class="table">

        <tr style="text-align:center;
                   font-weight:bold;
                   font-size:25px;">

            <td>RAIL FENCE CIPHER</td>

        </tr>

        <!-- ENCRYPTION -->
        <tr style="font-weight:bold; color:blue">
            <td>ENCRYPTION</td>
        </tr>

        <tr>
            <td>

                <form method="POST"
                      action="/railfence_encrypt">

                    <div class="mb-3">

                        <label class="form-label">
                            Plain text:
                        </label>

                        <input type="text"
                               class="form-control"
                               name="inputPlainText"
                               placeholder="Input Plain Text"
                               required autofocus>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Number of Rails:
                        </label>

                        <input type="text"
                               class="form-control"
                               name="inputKeyPlain"
                               placeholder="Input Number of Rails"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary">

                        Encrypt

                    </button>

                </form>

            </td>
        </tr>

        <!-- DECRYPTION -->
        <tr style="font-weight:bold; color:green">
            <td>DECRYPTION</td>
        </tr>

        <tr>
            <td>

                <form method="POST"
                      action="/railfence_decrypt">

                    <div class="mb-3">

                        <label class="form-label">
                            Cipher text:
                        </label>

                        <input type="text"
                               class="form-control"
                               name="inputCipherText"
                               placeholder="Input Cipher Text"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Number of Rails:
                        </label>

                        <input type="text"
                               class="form-control"
                               name="inputKeyCipher"
                               placeholder="Input Number of Rails"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-success">

                        Decrypt

                    </button>

                </form>

            </td>
        </tr>

    </table>

</div>

<script>
document.querySelectorAll('form').forEach(form => {
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const action = this.getAttribute('action');
        fetch(action, {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(html => {
            let resultDiv = this.querySelector('.result-container');
            if (!resultDiv) {
                resultDiv = document.createElement('div');
                resultDiv.className = 'result-container alert alert-info mt-3';
                this.appendChild(resultDiv);
            }
            resultDiv.innerHTML = html;
        });
    });
});
</script>
</body>
</html>
